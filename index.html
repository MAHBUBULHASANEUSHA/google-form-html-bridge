<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #4646af;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 380px;
        }
        .form-container h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>User Information</h2>


    <form action="https://docs.google.com/forms/d/e/1FAIpQLSeKLmhAkoGbwqF04NtOrDQ828-J2ZhBJMHlsr2fmrBBOJIATA/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">


        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="entry.1168555160" placeholder="Enter your name" required>
        </div>


        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="entry.612284282" placeholder="Enter your address" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="entry.758720347" placeholder="Enter phone number" required>
        </div>


        <div class="form-group">
            <label for="details">Additional Information</label>
            <textarea id="details" name="entry.156983012" rows="3" placeholder="Enter additional information"></textarea>
        </div>

        <button type="submit">Submit</button>
    </form>
</div>


<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {alert('Data successfully saved to Google Form!'); window.location.reload();}"></iframe>

<script>
    var submitted = false;
</script>

</body>
</html>
